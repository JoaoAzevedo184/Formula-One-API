services:
  db:
    image: postgres:17-alpine
    container_name: formula-one-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api-formula-one
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  api:
    build: .
    container_name: formula-one-api
    environment:
      PORT: 3333
      # Rede interna do Compose: usa o nome do serviço, não "localhost", e a
      # porta interna do Postgres (5432), não a mapeada no host (5434).
      DATABASE_URL: postgresql://postgres:postgres@db:5432/api-formula-one
      DIRECT_URL: postgresql://postgres:postgres@db:5432/api-formula-one
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
